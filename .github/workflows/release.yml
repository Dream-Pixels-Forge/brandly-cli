name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

# One publish at a time per tag: two `published` events (unpublish → republish,
# or back-to-back tags) must never race the same version onto PyPI. Not
# cancelling, because a cancelled publish can leave a partial upload behind.
# Workflow-scoped group so this can never cancel a CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # Gate: a release must never publish code that has not passed lint, typing and
  # the test suite. CI only runs on PRs and pushes to main (no tag trigger), so
  # this job re-verifies the tag commit itself — the tag is the thing being shipped.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]" types-PyYAML

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Run tests
        run: python -m pytest tests/ -q

  publish:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/brandly-cli
    permissions:
      id-token: write  # OIDC trusted publishing

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: python scripts/version_check.py --tag "${{ github.event.release.tag_name }}"

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check build
        run: python -m twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error

      - name: Release to PyPI (skip if already published)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Verify release is installable from PyPI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          pkg = "brandly-cli"
          version_url = f"https://pypi.org/pypi/{pkg}/{version}/json"
          project_url = f"https://pypi.org/pypi/{pkg}/json"

          def fetch(url: str) -> dict:
              req = urllib.request.Request(url, headers={"User-Agent": "release-verify"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          # Hard gate: the version-specific endpoint must list BOTH artifacts.
          # "some file exists" is not enough — a partial upload (sdist only, or
          # wheel only) must fail loudly instead of passing as a release.
          REQUIRED = {"bdist_wheel", "sdist"}

          def kinds(urls: list) -> set:
              found = set()
              for entry in urls:
                  kind = entry.get("packagetype")
                  name = entry.get("filename") or ""
                  if not kind:
                      if name.endswith(".whl"):
                          kind = "bdist_wheel"
                      elif name.endswith((".tar.gz", ".zip")):
                          kind = "sdist"
                  if kind:
                      found.add(kind)
              return found

          deadline = time.time() + 180
          last_err = "unknown"
          while time.time() < deadline:
              try:
                  data = fetch(version_url)
                  urls = data.get("urls") or []
                  present = kinds(urls)
                  if REQUIRED <= present:
                      print(f"OK: {pkg}=={version} has {len(urls)} file(s) on PyPI")
                      break
                  last_err = f"missing {sorted(REQUIRED - present)} (present: {sorted(present) or 'none'})"
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_err = str(exc)
              time.sleep(10)
          else:
              sys.exit(
                  f"::error::{pkg}=={version} is not complete on PyPI after retries: {last_err}"
              )

          # Soft check: project-level JSON can lag CDN (~15-60 min). Warn only —
          # `pip install {pkg}=={version}` works as soon as the hard gate passes.
          try:
              latest = fetch(project_url)["info"]["version"]
          except (urllib.error.URLError, TimeoutError) as exc:
              print(f"WARN: could not read project JSON ({exc}); check https://pypi.org/project/{pkg}/ later")
          else:
              if latest == version:
                  print(f"OK: project latest is {latest}")
              else:
                  print(
                      f"WARN: project JSON still shows {latest} (CDN lag; usually clears in 15-60 min). "
                      f"Install now with: pip install {pkg}=={version}"
                  )
          print(f"Install: pip install {pkg}=={version}")
          PY

      - name: Write job summary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${RELEASE_TAG}"
          VER="${TAG#v}"
          {
            echo "## PyPI release \`${TAG}\`"
            echo ""
            echo "- Version endpoint verified: \`pip install brandly-cli==${VER}\`"
            echo "- Project page may lag CDN for 15–60 min; if it still shows an older version, that is cache — not a failed publish."
            echo "- Check: https://pypi.org/project/brandly-cli/${VER}/"
          } >> "$GITHUB_STEP_SUMMARY"

