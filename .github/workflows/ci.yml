name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (for PRs); keep main runs to
# avoid clobbering a long build when a new commit lands mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]" build twine types-PyYAML
          pip install import-linter

      - name: Version sync check
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          pyproject = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          about = pathlib.Path("src/brandly_cli/__about__.py").read_text(encoding="utf-8")
          m_py = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.M)
          m_ab = re.search(r'^__version__\s*=\s*"([^"]+)"', about, re.M)
          if not m_py or not m_ab:
              sys.exit("::error::Could not read version from pyproject.toml / __about__.py")
          if m_py.group(1) != m_ab.group(1):
              sys.exit(
                  f"::error::Version drift: pyproject={m_py.group(1)} "
                  f"__about__={m_ab.group(1)}. Update both before release."
              )
          print(f"Version sync OK: {m_py.group(1)}")
          PY

      - name: Lint
        run: ruff check src/ tests/

      - name: Import-linter
        run: python -c "from importlinter.cli import lint_imports; exit(lint_imports())"

      - name: Type check
        run: mypy src/

      - name: Syntax check
        run: python -m py_compile src/brandly_cli/*.py

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=brandly_cli --cov-report=xml --cov-report=term-missing

      - name: Build package
        run: python -m build

      - name: Check build
        run: python -m twine check dist/*

      - name: Upload dist
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload coverage
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn
