name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Least privilege: the repo default may be write-all. Artifact uploads use the
# Actions runtime token, not GITHUB_TOKEN, so `contents: read` is enough.
permissions:
  contents: read

# Cancel superseded runs on the same ref (for PRs). For main pushes the running
# job is never cancelled — but GitHub still allows only one running + one
# pending run per group, so a third rapid push drops the pending one. Branch
# protection is not configured here; do not read a missing run as a pass.
# The group is workflow-scoped so no other workflow can cancel these runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]" build twine types-PyYAML
          pip install import-linter pip-audit

      - name: Version sync check
        run: python scripts/version_check.py

      - name: Lint
        run: ruff check src/ tests/

      - name: Import-linter
        run: python -c "from importlinter.cli import lint_imports; exit(lint_imports())"

      - name: Type check
        run: mypy src/

      - name: Dependency vulnerability scan
        run: pip-audit --desc on --severity low

      - name: Syntax check
        run: python -m py_compile src/brandly_cli/*.py

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=brandly_cli --cov-report=xml --cov-report=term-missing

      - name: Build package
        run: python -m build

      - name: Check build
        run: python -m twine check dist/*

      - name: Upload dist
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload coverage
        if: ${{ matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Typecheck + build frontend
        working-directory: web
        run: npm run build

      - name: Verify bundled SPA is fresh
        run: |
          test -f src/brandly_cli/web/static/index.html
          grep -q "/static/assets/" src/brandly_cli/web/static/index.html
          test -n "$(ls src/brandly_cli/web/static/assets/index-*.js)"
          git diff --exit-code -- src/brandly_cli/web/static/ || (
            echo "::error::Bundled SPA is stale — run 'npm run build' in web/ and commit src/brandly_cli/web/static/"
            exit 1
          )
