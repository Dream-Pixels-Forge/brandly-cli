[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brandly-cli"
version = "0.3.15"
description = "AI product video orchestrator — add image, video, and sound generation to any AI tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dream Pixels Forge", email = "contact@dreampixelsforge.com" },
]
keywords = ["ai", "video", "image", "generation", "orchestrator", "cli", "agent", "product video", "marketing video", "blender 3d", "spatial reference", "keyframe video", "reference video", "multi-agent", "agentic ai", "social media", "content creation", "director agent", "pipeline orchestration", "creative ai", "video production", "brandly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[project.scripts]
brandly = "brandly_cli.cli:main"

[project.urls]
Homepage = "https://github.com/Dream-Pixels-Forge/brandly-cli"
Repository = "https://github.com/Dream-Pixels-Forge/brandly-cli"
Issues = "https://github.com/Dream-Pixels-Forge/brandly-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/brandly_cli"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
