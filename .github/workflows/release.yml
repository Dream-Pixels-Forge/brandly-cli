name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/brandly-cli
    permissions:
      id-token: write  # OIDC trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package versions
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          tag = "${{ github.event.release.tag_name }}"
          tag_ver = tag[1:] if tag.startswith("v") else tag

          pyproject = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          about = pathlib.Path("src/brandly_cli/__about__.py").read_text(encoding="utf-8")
          m_py = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.M)
          m_ab = re.search(r'^__version__\s*=\s*"([^"]+)"', about, re.M)
          if not m_py or not m_ab:
              sys.exit("::error::Could not read version from pyproject.toml / __about__.py")

          py_ver, ab_ver = m_py.group(1), m_ab.group(1)
          print(f"tag={tag_ver} pyproject={py_ver} __about__={ab_ver}")
          if tag_ver != py_ver or tag_ver != ab_ver:
              sys.exit(
                  f"::error::Version mismatch: tag={tag_ver} pyproject={py_ver} "
                  f"__about__={ab_ver}. Bump both files and re-tag."
              )
          print("Version consistency OK")
          PY

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check build
        run: python -m twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error

      - name: Release to PyPI (skip if already published)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Verify release is installable from PyPI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          pkg = "brandly-cli"
          version_url = f"https://pypi.org/pypi/{pkg}/{version}/json"
          project_url = f"https://pypi.org/pypi/{pkg}/json"

          def fetch(url: str) -> dict:
              req = urllib.request.Request(url, headers={"User-Agent": "release-verify"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          # Hard gate: version-specific endpoint must list upload files.
          # This is the source of truth for "did the publish land?"
          deadline = time.time() + 180
          last_err = "unknown"
          while time.time() < deadline:
              try:
                  data = fetch(version_url)
                  urls = data.get("urls") or []
                  if urls:
                      print(f"OK: {pkg}=={version} has {len(urls)} file(s) on PyPI")
                      break
                  last_err = "response had no files"
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_err = str(exc)
              time.sleep(10)
          else:
              sys.exit(f"::error::{pkg}=={version} not found on PyPI after retries: {last_err}")

          # Soft check: project-level JSON can lag CDN (~15-60 min). Warn only —
          # `pip install {pkg}=={version}` works as soon as the hard gate passes.
          try:
              latest = fetch(project_url)["info"]["version"]
          except (urllib.error.URLError, TimeoutError) as exc:
              print(f"WARN: could not read project JSON ({exc}); check https://pypi.org/project/{pkg}/ later")
          else:
              if latest == version:
                  print(f"OK: project latest is {latest}")
              else:
                  print(
                      f"WARN: project JSON still shows {latest} (CDN lag; usually clears in 15-60 min). "
                      f"Install now with: pip install {pkg}=={version}"
                  )
          print(f"Install: pip install {pkg}=={version}")
          PY

      - name: Write job summary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${RELEASE_TAG}"
          VER="${TAG#v}"
          {
            echo "## PyPI release \`${TAG}\`"
            echo ""
            echo "- Version endpoint verified: \`pip install brandly-cli==${VER}\`"
            echo "- Project page may lag CDN for 15–60 min; if it still shows an older version, that is cache — not a failed publish."
            echo "- Check: https://pypi.org/project/brandly-cli/${VER}/"
          } >> "$GITHUB_STEP_SUMMARY"

